services:
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

  # --- Postgres: СУБД ---
  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    env_file:
      - .env
    ports:
      - '5432:5432'
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
