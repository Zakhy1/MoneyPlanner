fix = true
exclude = ["migrations", ".git", ".venv", "__pycache__"]
line-length = 90
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warning
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake-comprehensions
    "A",    # flake8 builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "DJ",   # flake8-django
    "ISC",  # flake8-implicit-str-concat
    "T20",  # flake8-print
    "SLF",  # flake8-simplify
    "RUF",  # Ruff
    "FAST"
]

ignore = [
    "E501",
    "E402",
    "F403",
    "F405",
    "DJ001",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "COM812"
]

[lint.per-file-ignores]
"serializers.py" = ["N815", "N802"]
"config/gunicorn.conf.py" = ["N999"]
"test_modbus/*.py" = ["T201", "DTZ001", "DTZ005"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
